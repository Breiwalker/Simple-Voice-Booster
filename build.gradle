plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "simple_voice_booster" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    mavenCentral()
    // Repository for the Simple Voice Chat API
    maven {
        url = 'https://maven.maxhenkel.de/repository/public'
    }
    // Repository for the full Simple Voice Chat mod (mixin targets)
    maven {
        url = 'https://api.modrinth.com/maven'
    }
    // Repository for Mod Menu (optional integration)
    maven {
        url = 'https://maven.terraformersmc.com/releases'
    }
}

dependencies {
    // Minecraft 26.x is unobfuscated, so no mappings are required.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Simple Voice Chat API (compile-time only, provided by the voicechat mod at runtime)
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"

    // Full Simple Voice Chat mod - needed to compile the mixins that patch its internals.
    // Minecraft 26.x is unobfuscated, so no remapping is required and plain
    // compileOnly/runtimeOnly dependencies work. Not bundled; users install it separately.
    compileOnly "maven.modrinth:simple-voice-chat:${project.voicechat_version}"
    runtimeOnly "maven.modrinth:simple-voice-chat:${project.voicechat_version}"

    // Mod Menu - compile-time only, present at runtime if the user has it installed
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

// Auf Java 21 korrigiert (Standard für neuere MC-Versionen)
def targetJavaVersion = 25

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}